name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Docs/**"
      - "infra/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DEPLOY_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/Crime-IS-github-actions-deploy-role
  IMAGE_TAG: git-${{ github.sha }}

jobs:
  # test will be on the local setup, with pytest
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crimedb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crimedb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r streamlit_app/requirements.txt

      - name: Create the schema
        run: python -m App.db.setup_db

      - name: Run the test suite
        run: pytest -q

      # for load testing
      - name: Check the k6 scripts parse
        run: |
          for script in steady_state stress smoke_frontend; do
            docker run --rm -v "$PWD/loadtest/k6:/scripts" grafana/k6:0.55.0 \
              inspect "/scripts/${script}.js"
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # build both backend and frontend images in parallel
      matrix:
        include:
          - tier: backend
            repository: cis-image
            context: .
          - tier: frontend
            repository: cis-frontend-image
            context: streamlit_app/
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push ${{ matrix.tier }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ matrix.repository }}:${IMAGE_TAG}"
          docker build -t "$IMAGE" -t "${REGISTRY}/${{ matrix.repository }}:latest" "${{ matrix.context }}"
          docker push "$IMAGE"
          docker push "${REGISTRY}/${{ matrix.repository }}:latest"

  deploy:
    # deploy the backend and frontend in parallel
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tier: backend
            repository: cis-image
            family: crime-is-app
            container: app
            cluster: crime-is-cluster
            service: crime-is-service
            target_group: crime-is-tg
          - tier: frontend
            repository: cis-frontend-image
            family: crime-is-frontend-app
            container: frontend
            cluster: crime-is-frontend-cluster
            service: crime-is-frontend-service
            alb: crime-is-frontend-alb
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Register a task definition using the new image
        id: taskdef
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        # codde where we are registering new task definition with the new image, and saving the ARN of the new task definition to an output variable
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ matrix.repository }}:${IMAGE_TAG}"
          aws ecs describe-task-definition --task-definition "${{ matrix.family }}" \
            --query 'taskDefinition' --output json > current.json
          jq --arg IMAGE "$IMAGE" --arg NAME "${{ matrix.container }}" '
            .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' current.json > next.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"

      - name: Migrate the database
        if: matrix.tier == 'backend'
        env:
          TASKDEF_ARN: ${{ steps.taskdef.outputs.arn }}
          SUBNETS: ${{ vars.PRIVATE_SUBNET_IDS }}
          SG: ${{ vars.ECS_TASK_SG_ID }}
        # migration stemps -- set up the database schema by running a one-off ECS task with the new image, and wait for it to complete
        run: |
          set -euo pipefail
          if [ -z "${SUBNETS}" ]; then
            SUBNETS=$(aws ec2 describe-subnets --filters "Name=tag:Tier,Values=app" \
              --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          fi
          if [ -z "${SG}" ]; then
            SG=$(aws ec2 describe-security-groups --filters "Name=tag:Name,Values=Crime-IS-ecs-sg" \
              --query 'SecurityGroups[0].GroupId' --output text)
          fi
          if [ -z "${SUBNETS}" ] || [ -z "${SG}" ] || [ "${SG}" = "None" ]; then
            echo "could not resolve subnets ('${SUBNETS}') or security group ('${SG}')" >&2
            exit 1
          fi
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ matrix.cluster }}" \
            --task-definition "${TASKDEF_ARN}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ matrix.container }}","command":["python","-m","App.db.setup_db"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${{ matrix.cluster }}" --tasks "${TASK_ARN}"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "${{ matrix.cluster }}" --tasks "${TASK_ARN}" \
            --query "tasks[0].containers[?name=='${{ matrix.container }}'].exitCode | [0]" --output text)
          REASON=$(aws ecs describe-tasks --cluster "${{ matrix.cluster }}" --tasks "${TASK_ARN}" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "migration exited ${EXIT_CODE} (${REASON})"
          [ "${EXIT_CODE}" = "0" ]

      - name: Roll the service
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "${{ matrix.cluster }}" \
            --service "${{ matrix.service }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" >/dev/null
          aws ecs wait services-stable --cluster "${{ matrix.cluster }}" --services "${{ matrix.service }}"

      - name: Check backend targets are healthy
        if: matrix.tier == 'backend'
        run: |
          set -euo pipefail
          TG_ARN=$(aws elbv2 describe-target-groups --names "${{ matrix.target_group }}" \
            --query 'TargetGroups[0].TargetGroupArn' --output text)
          for i in $(seq 1 10); do
            STATES=$(aws elbv2 describe-target-health --target-group-arn "${TG_ARN}" \
              --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)
            echo "attempt ${i}/10: [${STATES:-none}]"
            if [ -n "${STATES}" ] && ! echo "${STATES}" | grep -qv healthy; then
              echo "all targets healthy"
              exit 0
            fi
            sleep 15
          done
          echo "targets never all became healthy" >&2
          exit 1

      - name: Check the frontend is serving
        if: matrix.tier == 'frontend'
        env:
          OVERRIDE_URL: ${{ vars.FRONTEND_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE_URL}" ]; then
            BASE="${OVERRIDE_URL%/}"
          else
            DNS=$(aws elbv2 describe-load-balancers --names "${{ matrix.alb }}" \
              --query 'LoadBalancers[0].DNSName' --output text)
            BASE="http://${DNS}"
          fi
          for i in $(seq 1 10); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${BASE}/_stcore/health" || echo 000)
            echo "attempt ${i}/10: HTTP ${CODE}"
            [ "${CODE}" = "200" ] && exit 0
            sleep 15
          done
          echo "frontend never returned 200" >&2
          exit 1
